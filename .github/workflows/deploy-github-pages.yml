name: Deploy Angular a GitHub Pages

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    name: Build y pruebas
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Configurar Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: Instalar dependencias
        run: npm ci

      - name: Ejecutar pruebas
        run: npm test -- --no-watch

      - name: Build de Angular
        run: npx ng build --configuration production --base-href "/${{ github.event.repository.name }}/"

      - name: Subir artefacto
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/lab-pipelines-hash/browser

  deploy:
    name: Deploy
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Desplegar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  verify:
    name: Verificar despliegue
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Comprobar que la app responde
        run: |
          URL="${{ needs.deploy.outputs.page_url }}"
          echo "Verificando $URL"
          for i in $(seq 1 10); do
            STATUS=$(curl -s -o page.html -w "%{http_code}" "$URL")
            echo "Intento $i -> estado: $STATUS"
            if [ "$STATUS" = "200" ] && grep -q "<app-root" page.html; then
              echo "✅ La app está publicada y funcionando"
              exit 0
            fi
            sleep 10
          done
          echo "❌ La app no respondió correctamente"
          exit 1
